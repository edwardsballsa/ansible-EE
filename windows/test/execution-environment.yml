version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-27/ee-supported-rhel9:latest
#    name: registry.fedoraproject.org/fedora:42

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  python: requirements.txt
  system: bindep.txt
  galaxy: requirements.yml
  python_interpreter:
    package_system: python3-pip
    python_path: /usr/bin/python3
  ansible_core:
    package_pip: ansible-core
  ansible_runner:
    package_pip: ansible-runner

additional_build_steps:
  prepend_base:
    - RUN microdnf install -y python3-pip
    - RUN python3 -m pip install --upgrade pip  
    - RUN dnf groupinstall -y "Development Tools" || microdnf install -y gcc python3-devel
    - RUN dnf install -y libxml2-devel libcurl-devel openssl-devel || microdnf install -y libxml2-devel libcurl-devel openssl-devel

